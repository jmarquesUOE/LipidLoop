[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lipidloop"
version = "1.0.0"
description = "An open, error-controlled LC-MS/MS lipidomics pipeline that closes the loop between identification and acquisition"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jair G. Marques"}, {name = "Alex von Kriegsheim"}]
keywords = ["lipidomics", "mass spectrometry", "LC-MS/MS", "target-decoy", "pyOpenMS"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyteomics>=4.6",
    "lxml>=4.9",
    "pyopenms>=3.5",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
paper = ["matplotlib>=3.8", "scipy>=1.11", "cairosvg>=2.7"]

[project.urls]
Repository = "https://github.com/jmarquesUOE/LipidLoop"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Compound Discoverer + LipiDex reference export (LIPIDLOOP_REFERENCE_DIR); slow",
    "slow: builds figures or a PDF; seconds rather than milliseconds",
]
